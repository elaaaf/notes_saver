<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Saver</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Note Saver</h1>
            <p class="subtitle">Save notes and hear them as podcasts</p>
        </header>

        <section class="create-section">
            <form id="note-form">
                <input type="text" id="note-title" placeholder="Title (optional)" maxlength="50">
                <textarea id="note-content" placeholder="Write your note here..." rows="4" required></textarea>
                <button type="submit" class="save-btn">Save Note</button>
            </form>
            <div id="status" class="status hidden"></div>
        </section>

        <section class="notes-section">
            <h2>Your Notes</h2>
            <div id="notes-list" class="notes-list">
                <p class="loading">Loading notes...</p>
            </div>
        </section>
    </div>

    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            <h3 id="modal-title">Note</h3>
            <p id="modal-text"></p>
            <div class="modal-actions">
                <button id="speak-btn" class="speak-btn">🎙️ Play Podcast</button>
                <button id="delete-btn" class="delete-btn">Delete</button>
            </div>
            <audio id="audio-player" controls class="hidden"></audio>
        </div>
    </div>

    <script>
        const noteForm = document.getElementById('note-form');
        const noteTitle = document.getElementById('note-title');
        const noteContent = document.getElementById('note-content');
        const statusDiv = document.getElementById('status');
        const notesList = document.getElementById('notes-list');
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modal-title');
        const modalText = document.getElementById('modal-text');
        const modalClose = document.querySelector('.modal-close');
        const speakBtn = document.getElementById('speak-btn');
        const deleteBtn = document.getElementById('delete-btn');
        const audioPlayer = document.getElementById('audio-player');

        let currentNoteId = null;

        // Form submit handler
        noteForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const title = noteTitle.value.trim();
            const content = noteContent.value.trim();
            
            if (!content) return;

            showStatus('Saving...', 'info');

            try {
                const response = await fetch('/notes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, content })
                });

                const data = await response.json();

                if (data.success) {
                    showStatus('Note saved!', 'success');
                    noteTitle.value = '';
                    noteContent.value = '';
                    loadNotes();
                    setTimeout(() => hideStatus(), 2000);
                } else {
                    showStatus(data.error || 'Failed to save', 'error');
                }
            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
            }
        });

        // Load notes list
        async function loadNotes() {
            try {
                const response = await fetch('/notes');
                const data = await response.json();

                if (data.notes && data.notes.length > 0) {
                    notesList.innerHTML = data.notes.map(note => `
                        <div class="note-card" data-id="${note.id}">
                            <div class="note-title">${escapeHtml(note.title)}</div>
                            <div class="note-date">${formatDate(note.date)}</div>
                            <div class="note-preview">${escapeHtml(note.preview)}</div>
                        </div>
                    `).join('');

                    document.querySelectorAll('.note-card').forEach(card => {
                        card.addEventListener('click', () => openNote(card.dataset.id));
                    });
                } else {
                    notesList.innerHTML = '<p class="empty">No notes yet. Create one above!</p>';
                }
            } catch (error) {
                notesList.innerHTML = '<p class="error">Failed to load notes</p>';
            }
        }

        // Open note in modal
        async function openNote(noteId) {
            currentNoteId = noteId;
            audioPlayer.classList.add('hidden');
            audioPlayer.pause();
            speakBtn.disabled = false;
            speakBtn.textContent = '🎙️ Play Podcast';

            try {
                const response = await fetch(`/notes/${noteId}`);
                const data = await response.json();
                modalTitle.textContent = data.title;
                modalText.textContent = data.content;
                modal.classList.remove('hidden');
            } catch (error) {
                alert('Failed to load note');
            }
        }

        // Speak note
        speakBtn.addEventListener('click', async () => {
            if (!currentNoteId) return;

            speakBtn.disabled = true;
            speakBtn.textContent = '⏳ Generating...';

            try {
                const response = await fetch(`/speak/${currentNoteId}`, { method: 'POST' });
                const data = await response.json();

                if (data.success) {
                    audioPlayer.src = data.audio_url;
                    audioPlayer.classList.remove('hidden');
                    audioPlayer.play();
                    speakBtn.textContent = '🎙️ Play Podcast';
                    speakBtn.disabled = false;
                } else {
                    alert(data.error || 'Failed to generate audio');
                    speakBtn.textContent = '🎙️ Play Podcast';
                    speakBtn.disabled = false;
                }
            } catch (error) {
                alert('Error: ' + error.message);
                speakBtn.textContent = '🎙️ Play Podcast';
                speakBtn.disabled = false;
            }
        });

        // Delete note
        deleteBtn.addEventListener('click', async () => {
            if (!currentNoteId) return;
            if (!confirm('Delete this note?')) return;

            try {
                const response = await fetch(`/notes/${currentNoteId}`, { method: 'DELETE' });
                const data = await response.json();

                if (data.success) {
                    modal.classList.add('hidden');
                    loadNotes();
                } else {
                    alert(data.error || 'Failed to delete');
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });

        // Close modal
        modalClose.addEventListener('click', () => {
            modal.classList.add('hidden');
            audioPlayer.pause();
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.add('hidden');
                audioPlayer.pause();
            }
        });

        // Helpers
        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }

        function hideStatus() {
            statusDiv.className = 'status hidden';
        }

        function formatDate(isoDate) {
            const date = new Date(isoDate);
            return date.toLocaleDateString('en-US', {
                month: 'short', day: 'numeric', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load notes on page load
        loadNotes();
    </script>
</body>
</html>
